# Example nginx site config for the crackNum web GUI behind TLS.
#
# Copy to your nginx conf.d directory and replace cracknum.example.com with
# your own hostname. Pair with cracknum-tls.service, which binds the app to
# 127.0.0.1:8080 so nginx is the only thing that can reach it.
#
# On an SELinux-enforcing host (RHEL/Rocky/Fedora), nginx cannot open a socket
# to the backend until you run:
#     setsebool -P httpd_can_network_connect 1
# Without it every request is a 502 and the error log does not say why.

# Per-client limits for the endpoint that starts crackNum and z3. The backend
# has its own global concurrency ceilings as a second line of defence.
limit_req_zone  $binary_remote_addr zone=cracknum_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=cracknum_connections:10m;

server {
    listen      80;
    listen      [::]:80;
    server_name cracknum.example.com;
    return 301  https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name cracknum.example.com;

    # Server certificate followed by any intermediates, leaf first.
    ssl_certificate     /etc/pki/tls/certs/cracknum.crt;
    ssl_certificate_key /etc/pki/tls/private/cracknum.key;  # mode 0600, root-owned
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS deliberately left off. It protects against an attacker intercepting
    # the one plaintext request a browser sends before it learns to use https --
    # a modest gain for an internal tool with no login and nothing secret.
    #
    # Against that: it is sticky and cannot be revoked within its lifetime, and
    # it removes the browser's "proceed anyway" for a bad certificate. With a
    # short-lived cert renewed by hand, a missed renewal turns from a warning
    # page into a site nobody can reach -- and you cannot serve the max-age=0
    # that would clear it, because the thing that serves it is the thing that
    # is broken. The downside is badly asymmetric, so it stays off.
    #
    # If you do want it, prefer a short max-age -- a day, not a year -- so a
    # mistake heals on its own:
    # add_header Strict-Transport-Security "max-age=86400" always;

    # A crack is capped at 10s server-side; give the proxy some headroom.
    proxy_read_timeout 30s;

    location = /api/crack {
        limit_req zone=cracknum_requests burst=10 nodelay;
        limit_req_status 429;
        limit_conn cracknum_connections 4;

        proxy_pass       http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass       http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
